spring:
  application:
    name: ajin-on-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55434/ajin_on}
    username: ${DATABASE_USERNAME:ajin_on}
    password: ${DATABASE_PASSWORD:ajin_on_local}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  address: ${HOST:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  storage-root: ${STORAGE_ROOT:.local/storage}
  allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:5175,http://localhost:5175}
