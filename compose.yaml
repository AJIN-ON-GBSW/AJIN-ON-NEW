services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ajin_on
      POSTGRES_USER: ajin_on
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajin_on_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55434}:5432"
    volumes:
      - ajin-on-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajin_on -d ajin_on"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ajin-on-postgres-data:
